title: Ausschreibung
icon: file-document

tabs:
  text:
    label: Angaben
    icon: text
    sections:
      angaben:
        type: fields
        fields:
          intro:
            label: Einleitungstext
            type: textarea
            size: small
          punkte:
            label: Organisatorisches
            type: structure
            help: Anmeldung, Garderoben, Parkplatz, Versicherung und so weiter.
            columns:
              stichwort:
                width: 1/3
              text:
                width: 2/3
            fields:
              stichwort:
                label: Stichwort
                type: text
                required: true
                placeholder: Anmeldung
              text:
                label: Text
                type: textarea
                size: small
                buttons: false
                required: true

  kopfbild:
    label: Kopfbild
    icon: image
    sections:
      kopf:
        type: fields
        fields:
          kopfHintergrund:
            label: Hintergrundbild des Kopfbereichs
            type: files
            query: page.images
            uploads:
              template: bild
            max: 1
            layout: cards
            help: Wird stark weichgezeichnet hinter dem Titel angezeigt. Ein Bild zum Thema der Seite.

  kategorien:
    label: Kategorien
    icon: list-bullet
    sections:
      kat:
        type: fields
        fields:
          kategorien:
            label: Kategorien und Startzeiten
            type: structure
            sortBy: startzeit asc
            help: Diese Tabelle erscheint eins zu eins auf der Website.
            columns:
              startzeit:
                width: 1/6
              bezeichnung:
                width: 2/6
              kuerzel:
                width: 1/6
              distanz:
                width: 1/6
              startgeld:
                width: 1/6
            fields:
              bezeichnung:
                label: Bezeichnung
                type: text
                required: true
                placeholder: Piccolo Knaben
              kuerzel:
                label: Kategorie
                type: text
                width: 1/4
                placeholder: A
              jahrgang:
                label: Jahrgang
                type: text
                width: 3/4
                placeholder: 2016 – 2017
              startzeit:
                label: Startzeit
                type: text
                width: 1/3
                placeholder: "17:25"
              runden:
                label: Runden
                type: text
                width: 1/3
                placeholder: 1 kleine Runde
              distanz:
                label: Distanz
                type: text
                width: 1/3
                placeholder: 1210 m
              startgeld:
                label: Startgeld
                type: text
                width: 1/3
                placeholder: CHF 6

  dateien:
    label: Dateien
    icon: download
    sections:
      dateien:
        type: files
        label: Ausschreibung als PDF
        template: rangliste
        layout: table
        image: false
