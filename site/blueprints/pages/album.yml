title: Fotoalbum
icon: image

options:
  changeTemplate: false

columns:
  - width: 2/3
    sections:
      angaben:
        type: fields
        fields:
          beschreibung:
            label: Beschreibung
            type: textarea
            size: small
          fotograf:
            label: Fotograf/in
            type: text
            help: Erscheint als Bildnachweis unter dem Album.

  - width: 1/3
    sections:
      einordnung:
        type: fields
        fields:
          jahr:
            label: Jahr
            type: number
            required: true
            step: 1
            min: 1995
            max: 2100
          lauf:
            label: Lauf
            type: select
            options:
              "1": 1. Abend
              "2": 2. Abend
              "3": 3. Abend
              gesamt: Schlussfeier / Gesamt
          datum:
            label: Datum des Laufs
            type: date
            display: DD.MM.YYYY
          cover:
            label: Titelbild
            type: files
            query: page.images
            max: 1
            layout: cards
            help: Leer lassen = erstes Bild des Albums.

  - width: 1/1
    sections:
      bilder:
        type: files
        label: Bilder
        template: foto
        layout: cards
        size: small
        sortable: true
        empty: Bilder hierher ziehen
        help: Mehrere Dateien auf einmal hineinziehen. Reihenfolge durch Verschieben ändern.
