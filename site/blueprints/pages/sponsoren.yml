title: Sponsoren
icon: heart

columns:
  - width: 1/1
    sections:
      text:
        type: fields
        fields:
          intro:
            label: Einleitungstext
            type: textarea
            size: small

  - width: 1/1
    sections:
      liste:
        type: fields
        fields:
          sponsoren:
            label: Sponsoren
            type: structure
            help: Logos zuerst unter „Logos" hochladen, danach hier zuordnen. Reihenfolge durch Verschieben ändern.
            columns:
              name:
                width: 2/5
              kategorie:
                width: 1/5
              logo:
                width: 1/5
              aktiv:
                width: 1/5
            fields:
              name:
                label: Name
                type: text
                required: true
              logo:
                label: Logo
                type: files
                query: page.images
                max: 1
              url:
                label: Website
                type: url
              kategorie:
                label: Kategorie
                type: select
                default: sponsor
                options:
                  haupt: Hauptsponsor
                  co: Co-Sponsor
                  sponsor: Sponsor
                  goenner: Gönner
              aktiv:
                label: Aktiv
                type: toggle
                default: true
                text:
                  - pausiert
                  - wird gezeigt

  - width: 1/1
    sections:
      logos:
        type: files
        label: Logos
        template: logo
        layout: cards
        size: small
        empty: Logos hierher ziehen

  - width: 1/1
    sections:
      kopf:
        type: fields
        fields:
          kopfHintergrund:
            label: Hintergrundbild des Kopfbereichs
            type: files
            query: page.images
            uploads:
              template: bild
            max: 1
            layout: cards
            help: Wird stark weichgezeichnet hinter dem Titel angezeigt. Ein Bild zum Thema der Seite.
