<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;600&family=Source+Sans+3:wght@400;600;700&display=swap">
  <style>
    body { margin: 0; background: #0C1524; color: #F2EFE9;
           font-family: 'Source Sans 3', 'Helvetica Neue', Helvetica, sans-serif; }
    a { color: #F2751F; } a:hover { color: #FF9A4D; }
    .osw { font-family: 'Oswald', 'Arial Narrow', sans-serif; text-transform: uppercase; letter-spacing: 0.01em; }
    .lbl { font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #8FA3BF; font-weight: 600; }
  </style>
</helmet>

<div style="width: 1280px; background: #0C1524;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 48px; border-bottom: 1px solid #1C2A42;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <img src="logo.png" alt="" style="width: 40px; height: auto; display: block;">
      <span class="osw" style="font-size: 20px; font-weight: 600;">Urner Abendläufe</span>
    </div>
    <div style="display: flex; gap: 26px; font-size: 14px; font-weight: 600;">
      <span>Ausschreibung</span><span>Strecke</span><span>Ranglisten</span>
      <span style="color: #F2751F;">Fotos</span><span>Sponsoren</span><span>Das OK</span><span>Kontakt</span>
    </div>
  </div>

  <!-- Albumkopf mit Titelbild -->
  <div style="position: relative; height: 340px;">
    <img src="podest.jpg" alt="Rangverkündigung" style="width: 100%; height: 100%; object-fit: cover; display: block;">
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,21,36,0.35) 0%, rgba(12,21,36,0.96) 100%);"></div>
    <div style="position: absolute; left: 48px; right: 48px; bottom: 32px;">
      <p class="lbl" style="margin: 0 0 12px; color: #29ABE2;">Album · 2026</p>
      <h1 class="osw" style="margin: 0; font-size: 58px; line-height: 0.95; font-weight: 600;">32. Abendläufe — 3. Abend</h1>
      <p style="margin: 14px 0 0; font-size: 16px; color: #C4D0E0;">
        148 Bilder · 2. September 2026 · Fotos von Thomas Hager
      </p>
    </div>
  </div>

  <!-- Alben-Navigation -->
  <div style="display: flex; align-items: center; gap: 10px; padding: 24px 48px 4px; flex-wrap: wrap;">
    <span style="background: #F2751F; color: #0C1524; padding: 9px 18px; font-size: 13px; font-weight: 700; border-radius: 999px;">2026 · 3. Abend</span>
    <span style="background: #131F33; padding: 9px 18px; font-size: 13px; font-weight: 600; border-radius: 999px;">2026 · 2. Abend</span>
    <span style="background: #131F33; padding: 9px 18px; font-size: 13px; font-weight: 600; border-radius: 999px;">2026 · 1. Abend</span>
    <span style="background: #131F33; padding: 9px 18px; font-size: 13px; font-weight: 600; border-radius: 999px;">2025</span>
    <span style="background: #131F33; padding: 9px 18px; font-size: 13px; font-weight: 600; border-radius: 999px;">2024</span>
  </div>

  <!-- Mauerwerk-Raster: Hochformate bekommen Platz -->
  <div style="padding: 26px 48px 46px;">
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px;">

      <div style="grid-column: span 2; border-radius: 12px; overflow: hidden; height: 300px;">
        <img src="familie.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
      </div>
      <div style="border-radius: 12px; overflow: hidden; height: 300px;">
        <img src="laeufer.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
      </div>
      <div style="border-radius: 12px; overflow: hidden; height: 300px;">
        <img src="ziel1.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
      </div>

      <div style="border-radius: 12px; overflow: hidden; height: 220px;">
        <img src="feld1.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
      </div>
      <div style="border-radius: 12px; overflow: hidden; height: 220px;">
        <img src="feld2.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
      </div>
      <div style="grid-column: span 2; border-radius: 12px; overflow: hidden; height: 220px;">
        <img src="feld3.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
      </div>

      <div style="border-radius: 12px; overflow: hidden; height: 260px;">
        <img src="ziel2.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
      </div>
      <div style="grid-column: span 2; border-radius: 12px; overflow: hidden; height: 260px;">
        <img src="podest.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
      </div>
      <div style="border-radius: 12px; overflow: hidden; height: 260px;">
        <img src="feld1.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
      </div>

    </div>

    <div style="display: flex; justify-content: center; margin-top: 30px;">
      <span style="border: 1px solid rgba(242,239,233,0.35); padding: 13px 30px; font-size: 14px; font-weight: 700; border-radius: 999px;">
        Weitere Bilder laden · 12 von 148
      </span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
