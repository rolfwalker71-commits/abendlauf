home:
  alias: '/home'

pages:
  # ics für den abonnierbaren Kalender /kalender.ics
  types: [html, htm, xml, txt, json, rss, atom, ics]
  theme: abendlauf

cache:
  enabled: true
  # Seiten mit Uhrzeit-Logik (Aktuell-Text um 21 Uhr, „In eigener Sache“,
  # „Neu online“, Terminkacheln) sollen nicht tagelang im Cache stehen.
  lifetime: 900
  check:
    method: file

assets:
  css_pipeline: false
  js_pipeline: false
  enable_asset_timestamp: false

errors:
  display: true
  log: true

debugger:
  enabled: false
  provider: clockwork

gpm:
  releases: stable
  verify_peer: true

updates:
  safe_upgrade: true
  safe_upgrade_snapshot_limit: 5

# Schweizer Zeitzone — sonst laufen Termine und Countdown falsch.
timezone: 'Europe/Zurich'

languages:
  default_lang: de

pages_dateformat: 'd.m.Y'
