title: Kontakt
extends@:
  type: default
  context: blueprints://pages

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:

        # Gravs Reiter „Inhalt“ zeigt dieselben Dateien wie unser
        # eigener Dateien-Reiter. Einmal reicht - sonst weiss niemand,
        # welcher der richtige ist.
        content:
          type: tab
          fields:
            header.media_order:
              type: hidden

        angaben:
          type: tab
          title: Angaben
          fields:
            header.intro:
              type: textarea
              label: Einleitungstext
              rows: 3
            header.formularaktiv:
              type: toggle
              label: Kontaktformular anzeigen
              highlight: 1
              default: true
              options:
                1: Wird angezeigt
                0: Ausgeblendet
              validate:
                type: bool
            hinweis:
              type: display
              size: large
              markdown: true
              content: |
                An welche Adresse die Nachrichten gehen, steht unter
                **Konfiguration → Site → Urner Abendläufe**.
            header.kopfhintergrund:
              type: pagemediaselect
              label: Vorschaubild beim Teilen
              help: Wird auf der Seite selbst nicht gezeigt. Erscheint nur, wenn jemand den Link auf Facebook, WhatsApp oder Instagram teilt.
              accept:
                - image/*

        text:
          type: tab
          title: Weitere Angaben
          fields:
            content:
              type: markdown
              label: Inhalt

        bilder:
          type: tab
          title: Bilder
          fields:
            header.media_order:
              type: pagemedia
              label: Bilder