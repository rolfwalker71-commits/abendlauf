title: Fotos
extends@:
  type: default
  context: blueprints://pages

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:

        # Die Bilder liegen in den Alben, nicht auf dieser Seite.
        content:
          type: tab
          fields:
            header.media_order:
              type: hidden

        angaben:
          type: tab
          title: Angaben
          fields:
            header.intro:
              type: textarea
              label: Einleitungstext
              rows: 3
            hinweis:
              type: display
              size: large
              markdown: true
              content: |
                **Die Alben der nächsten Saison liegen schon bereit.**

                Sobald die Laufabende auf der Startseite gespeichert sind, legt
                die Seite für jeden Abend ein Album an – dazu eines für die
                Siegerehrung. Titel, Jahr, Lauf, Datum und Fotograf/in sind
                ausgefüllt. **Leere Alben bleiben auf der Website unsichtbar.**

                So kommen Fotos dazu:

                1. Links im Seitenbaum unter „Fotos" das Album öffnen,
                   etwa „2. Abend 2027"
                2. Im Reiter **Bilder** die Fotos hineinziehen, auch mehrere
                   hundert auf einmal
                3. Speichern – mit dem ersten Bild erscheint das Album

                Ein Album von Hand anlegen geht weiterhin: *Hinzufügen → Seite*,
                Vorlage **Fotoalbum**, dann Jahr und Lauf setzen.