title: Strecke
extends@:
  type: default
  context: blueprints://pages

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:

        # Gravs Reiter „Inhalt“ zeigt dieselben Dateien wie unser
        # eigener Dateien-Reiter. Einmal reicht - sonst weiss niemand,
        # welcher der richtige ist.
        content:
          type: tab
          fields:
            header.media_order:
              type: hidden

        angaben:
          type: tab
          title: Runden
          fields:
            header.intro:
              type: textarea
              label: Einleitungstext
              rows: 3
            header.runden:
              type: list
              label: Runden
              style: vertical
              help: Karten zuerst unter „Dateien" hochladen, danach hier zuordnen.
              fields:
                .titel:
                  type: text
                  label: Bezeichnung
                  placeholder: Kleine Runde
                .distanz:
                  type: text
                  label: Distanz
                  placeholder: 1210 m
                .hoehenmeter:
                  type: text
                  label: Höhenunterschied
                  placeholder: flach
                .untergrund:
                  type: text
                  label: Untergrund
                  placeholder: Naturweg
                .kategorien:
                  type: text
                  label: Wer läuft hier
                .beschreibung:
                  type: textarea
                  label: Beschreibung
                  rows: 3
                .karte:
                  type: pagemediaselect
                  label: Streckenkarte
                  accept:
                    - image/*

        kopfbild:
          type: tab
          title: Teilen
          fields:
            header.kopfhintergrund:
              type: pagemediaselect
              label: Vorschaubild beim Teilen
              help: Wird auf der Seite selbst nicht gezeigt. Erscheint nur, wenn jemand den Link auf Facebook, WhatsApp oder Instagram teilt.
              accept:
                - image/*

        dateien:
          type: tab
          title: Dateien
          fields:
            header.media_order:
              type: pagemedia
              label: Karten und Bilder