title: Ausschreibung
extends@:
  type: default
  context: blueprints://pages

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:

        # Gravs Reiter „Inhalt“ zeigt dieselben Dateien wie unser
        # Reiter „Dateien“. Einmal reicht - sonst weiss niemand,
        # welcher der richtige ist.
        content:
          type: tab
          fields:
            header.media_order:
              type: hidden


        angaben:
          type: tab
          title: Angaben
          fields:
            header.intro:
              type: textarea
              label: Einleitungstext
              rows: 3
            header.punkte:
              type: list
              label: Organisatorisches
              style: vertical
              help: Anmeldung, Garderoben, Parkplatz, Versicherung und so weiter.
              fields:
                .stichwort:
                  type: text
                  label: Stichwort
                  placeholder: Anmeldung
                .text:
                  type: textarea
                  label: Text
                  rows: 4

        kategorien:
          type: tab
          title: Kategorien
          fields:
            header.kategorienjahr:
              type: number
              label: Kategorien gelten für das Jahr
              help: Erscheint klein hinter der Überschrift, damit Besucher sehen, dass die Angaben aktuell sind.
              validate:
                min: 1994
                max: 2100
            header.kategorien:
              type: list
              label: Kategorien und Startzeiten
              style: vertical
              help: Diese Tabelle erscheint eins zu eins auf der Website. Die Kennzahlen der Startseite werden daraus berechnet.
              fields:
                .bezeichnung:
                  type: text
                  label: Bezeichnung
                  placeholder: Piccolo Knaben
                .kuerzel:
                  type: text
                  label: Kategorie
                  placeholder: A
                .gruppe:
                  type: select
                  label: Gruppe
                  help: Bestimmt Symbol und Farbe der Karte.
                  default: maenner
                  options:
                    maenner: Männer
                    frauen: Frauen
                    knaben: Knaben
                    maedchen: Mädchen
                    familie: Eltern mit Kind
                .alter_min:
                  type: number
                  label: Alter ab
                  help: Jüngstes Alter in dieser Kategorie. Der Jahrgang wird daraus berechnet.
                  validate:
                    min: 1
                    max: 120
                .alter_max:
                  type: number
                  label: Alter bis
                  help: Leer lassen für „und älter" — so bei den Volksläufern.
                  validate:
                    min: 1
                    max: 120
                .startzeit:
                  type: text
                  label: Startzeit
                  placeholder: '17:25'
                .runden:
                  type: text
                  label: Runden
                  placeholder: 1 kleine Runde
                .distanz:
                  type: text
                  label: Distanz
                  placeholder: 1210 m
                .startgeld:
                  type: text
                  label: Startgeld
                  placeholder: CHF 6

        kopfbild:
          type: tab
          title: Teilen
          fields:
            header.kopfhintergrund:
              type: pagemediaselect
              label: Vorschaubild beim Teilen
              help: Wird auf der Seite selbst nicht gezeigt. Erscheint nur, wenn jemand den Link auf Facebook, WhatsApp oder Instagram teilt.
              accept:
                - image/*

        dateien:
          type: tab
          title: Dateien
          fields:
            header.media_order:
              type: pagemedia
              label: Ausschreibung als PDF