title: Einfache Seite
extends@:
  type: default
  context: blueprints://pages

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:

        # Gravs Reiter „Inhalt“ zeigt dieselben Dateien wie unser
        # Reiter „Dateien“. Einmal reicht - sonst weiss niemand,
        # welcher der richtige ist.
        content:
          type: tab
          fields:
            header.media_order:
              type: hidden

        inhalt:
          type: tab
          title: Text
          fields:
            header.intro:
              type: textarea
              label: Kurztext / Lead
              rows: 3
            content:
              type: markdown
              label: Inhalt

        kopfbild:
          type: tab
          title: Teilen
          fields:
            header.kopfhintergrund:
              type: pagemediaselect
              label: Vorschaubild beim Teilen
              help: Wird auf der Seite selbst nicht gezeigt. Erscheint nur, wenn jemand den Link auf Facebook, WhatsApp oder Instagram teilt.
              accept:
                - image/*

        dateien:
          type: tab
          title: Dateien
          fields:
            header.media_order:
              type: pagemedia
              label: Dateien zum Download