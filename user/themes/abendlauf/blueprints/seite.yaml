title: Einfache Seite
extends@:
  type: default
  context: blueprints://pages

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:

        # Gravs Reiter „Inhalt“ zeigt dieselben Dateien wie unser
        # Reiter „Dateien“. Einmal reicht - sonst weiss niemand,
        # welcher der richtige ist.
        content:
          type: tab
          fields:
            header.media_order:
              type: hidden

        inhalt:
          type: tab
          title: Inhalt
          fields:
            header.intro:
              type: textarea
              label: Kurztext / Lead
              rows: 3
            content:
              type: markdown
              label: Inhalt

        kopfbild:
          type: tab
          title: Kopfbild
          fields:
            header.kopfhintergrund:
              type: pagemedia
              label: Hintergrundbild des Kopfbereichs

        dateien:
          type: tab
          title: Dateien
          fields:
            media:
              type: file
              destination: self@
              multiple: true
              label: Dateien zum Download
