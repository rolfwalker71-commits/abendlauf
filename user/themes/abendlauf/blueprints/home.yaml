title: Startseite
extends@:
  type: default
  context: blueprints://pages

form:
  fields:
    tabs:
      type: tabs
      active: 1

      fields:

        # Gravs Reiter „Inhalt“ zeigt dieselben Dateien wie unser
        # eigener Dateien-Reiter. Einmal reicht - sonst weiss niemand,
        # welcher der richtige ist.
        content:
          type: tab
          fields:
            header.media_order:
              type: hidden

        kopf:
          type: tab
          title: Kopfbereich
          fields:
            header.headline:
              type: text
              label: Überschrift
              help: 'Beginnt die Überschrift mit einer Zahl und einem Punkt, wird die Zahl gross herausgestellt. Ohne Zahl rechnet die Seite die Austragungsnummer selbst aus — dann muss sie nie nachgezogen werden.'
            header.subline:
              type: text
              label: Unterzeile
            header.intro:
              type: textarea
              label: Einleitungstext
              rows: 4
            header.herobild:
              type: pagemediaselect
              label: Hintergrundbild
              help: Grosses Bild rechts neben der Überschrift.
              accept:
                - image/*

        insachen:
          type: tab
          title: In eigener Sache
          fields:
            erklaerung:
              type: display
              size: large
              markdown: true
              content: |
                **Für Mitteilungen, die nur eine Weile stehen sollen.**

                Der Bereich erscheint zuoberst, noch vor „Aktuell", und ist
                als vorübergehend erkennbar. Setze ein Datum bei
                **Anzeigen bis** — danach verschwindet er von selbst,
                auch wenn niemand daran denkt.
            header.insachenaktiv:
              type: toggle
              label: Bereich anzeigen
              highlight: 0
              default: false
              options:
                1: Wird angezeigt
                0: Ausgeblendet
              validate:
                type: bool
            header.insachentitel:
              type: text
              label: Überschrift
              default: In eigener Sache
            header.insachenbis:
              type: date
              label: Anzeigen bis
              help: Letzter Tag, an dem der Bereich erscheint. Leer = bis du ihn ausschaltest.
            header.insachentext:
              type: textarea
              label: Text
              rows: 16
              help: 'Absätze durch eine Leerzeile trennen, Links als [Text](Adresse).'

        aktuelles:
          type: tab
          title: Aktuelles
          fields:
            header.aktuellaktiv:
              type: toggle
              label: Bereich anzeigen
              highlight: 1
              default: true
              options:
                1: Wird angezeigt
                0: Ausgeblendet
              validate:
                type: bool
            header.aktuelltitel:
              type: text
              label: Überschrift
              default: Aktuell
            header.aktuellstand:
              type: date
              label: Stand vom
              help: Erscheint klein neben der Überschrift. Nach dem Wechsel gilt automatisch das Datum des Wechsels.
            wechselhinweis:
              type: display
              size: large
              markdown: true
              content: |
                **Zwei Texte, ein automatischer Wechsel.**

                Der erste steht vor und während der Laufabende. Nach der
                Rangverkündigung am letzten Abend wechselt die Seite von selbst
                auf den zweiten – du kannst ihn also schon vorher schreiben.

                In beiden Texten stehen Platzhalter, die sich jedes Jahr selbst
                füllen: `{nummer}` (33), `{jahr}` (2027), `{termine}`
                (18.8. / 25.8. / 1.9.), `{vorige_nummer}` (32),
                `{naechste_nummer}` (34), `{naechstes_jahr}` (2028).

                `{sponsoren}` steht auf einer eigenen Zeile und wird zur
                verlinkten Aufzählung aller Sponsoren, bei denen auf der
                Sponsorenseite *Im Danketext nennen* eingeschaltet ist.
                Weitere Zeilen mit Bindestrich darunter hängen sich an.

                Trägst du im Reiter *Laufabende* die Daten fürs nächste Jahr
                ein, beginnt der Kreislauf von vorn – ohne dass ein Text
                angepasst werden muss.
            header.aktuelltext:
              type: textarea
              label: Text vor und während der Laufabende
              rows: 14
              help: 'Aufzählungen mit einem Bindestrich am Zeilenanfang, Links als [Text](Adresse).'
            header.aktuellnachher:
              type: textarea
              label: Text nach der Rangverkündigung
              rows: 14
              help: Leer lassen, wenn nichts wechseln soll.
            header.aktuellwechsel:
              type: datetime
              label: Wechsel am
              help: Leer = am letzten Laufabend um 21 Uhr. Nur ausfüllen, wenn es anders sein soll.

        zahlen:
          type: tab
          title: Zahlen
          fields:
            hinweis_zahlen:
              type: display
              size: large
              markdown: true
              content: |
                Distanzen, Kategorien und Startgeld im Zahlenband werden aus
                der Ausschreibung und der Streckenseite berechnet. Nur die
                drei folgenden Werte stehen hier, weil sie aus den
                Ranglisten stammen.
            header.alterVon:
              type: number
              label: Jüngste Gewertete (Alter)
            header.alterBis:
              type: number
              label: Älteste Gewertete (Alter)
            header.anteilKinder:
              type: number
              label: Anteil Kinder- und Elternkategorien (%)
              validate:
                min: 0
                max: 100

        rekorde:
          type: tab
          title: Rekorde
          fields:
            header.rekordeaktiv:
              type: toggle
              label: Bereich anzeigen
              highlight: 1
              default: true
              options:
                1: Wird angezeigt
                0: Ausgeblendet
              validate:
                type: bool
            header.rekordetitel:
              type: text
              label: Überschrift
              default: Streckenrekorde
            header.rekordehinweis:
              type: text
              label: Hinweis zur Datenbasis
              help: Sollte sagen, worauf sich die Zeiten beziehen — sonst ist ein Rekord eine Behauptung.
            header.rekorde:
              type: list
              label: Rekorde
              style: vertical
              help: 'Neu auswerten nach einem Jahrgang: siehe werkzeuge/rekorde-auswerten.md'
              fields:
                .kategorie:
                  type: text
                  label: Kategorie
                .kuerzel:
                  type: text
                  label: Kategorie in der Ausschreibung
                  placeholder: J
                  help: Buchstabe der Kategorie unter Ausschreibung → Kategorien. Das Alter auf der Kachel kommt von dort.
                .gruppe:
                  type: select
                  label: Gruppe
                  help: Bestimmt Symbol und Farbe der Kachel.
                  default: maenner
                  options:
                    maenner: Männer
                    frauen: Frauen
                    knaben: Knaben
                    maedchen: Mädchen
                .zeit:
                  type: text
                  label: Zeit
                  placeholder: '21:15,1'
                .name:
                  type: text
                  label: Name
                .ort:
                  type: text
                  label: Wohnort
                  placeholder: Altdorf
                .datum:
                  type: date
                  label: Datum des Laufs
                  help: Das Jahr daraus erscheint auf der Kachel.
                .distanz:
                  type: text
                  label: Distanz
                  placeholder: 6700 m
                .frueher:
                  type: text
                  label: Anmerkung
                  help: 'Klein unter der Kachel. Etwa Zeiten auf früheren Streckenlängen (über 2180 m 7:24,8 · Simon Waldis, 2000) oder „Kategorie seit 2019“.'

        termine:
          type: tab
          title: Laufabende
          fields:
            header.laufabende:
              type: list
              label: Termine
              style: vertical
              help: Die Startseite zeigt automatisch die nächsten drei Termine. Vergangene verschwinden von selbst.
              fields:
                .titel:
                  type: text
                  label: Bezeichnung
                  placeholder: Erster Abend
                .datum:
                  type: datetime
                  label: Datum und Startzeit
                .ort:
                  type: text
                  label: Ort
                  default: Seerestaurant Seedorf
                .status:
                  type: select
                  label: Status
                  default: findet-statt
                  options:
                    findet-statt: Findet statt
                    abgesagt: Abgesagt
                    verschoben: Verschoben
                .statushinweis:
                  type: text
                  label: Hinweis zum Status
                  help: Wird bei „abgesagt" oder „verschoben" auf der Kachel gezeigt.
                .bild:
                  type: pagemediaselect
                  label: Bild
                  accept:
                    - image/*

        aktion:
          type: tab
          title: Aktion
          fields:
            header.aktionaktiv:
              type: toggle
              label: Bereich anzeigen
              highlight: 1
              default: true
              options:
                1: Wird angezeigt
                0: Ausgeblendet
              validate:
                type: bool
            header.aktionpartner:
              type: text
              label: Partner
              help: Erscheint klein über der Überschrift.
            header.aktiontitel:
              type: text
              label: Überschrift
            header.aktiontext:
              type: textarea
              label: Text
              rows: 6
            header.aktionbilder:
              type: pagemediaselect
              label: Bilder
              help: Ein bis drei Bilder, zum Beispiel Gutschein und Kontaktkarte.
              multiple: true
              accept:
                - image/*
            header.aktionlink:
              type: text
              label: Link
            header.aktionlinktext:
              type: text
              label: Beschriftung des Links
              default: Zum Shop

        hinweis:
          type: tab
          title: Hinweisbanner
          fields:
            header.hinweisaktiv:
              type: toggle
              label: Banner anzeigen
              highlight: 0
              default: false
              options:
                1: Wird angezeigt
                0: Ausgeblendet
              validate:
                type: bool
            header.hinweistext:
              type: textarea
              label: Text
              rows: 2
              help: Kurzmeldung zuoberst, z. B. „Ranglisten des 2. Abends sind online".
            header.hinweislink:
              type: text
              label: Link

        medien:
          type: tab
          title: Bilder
          fields:
            header.media:
              type: section
              title: Bilder dieser Seite
              underline: false
              fields:
                header.media_order:
                  type: pagemedia
                  label: Bilder