title: Das OK
extends@:
  type: default
  context: blueprints://pages

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:

        # Gravs Reiter „Inhalt“ zeigt dieselben Dateien wie unser
        # Reiter „Portraits“. Einmal reicht - sonst weiss niemand,
        # welcher der richtige ist.
        content:
          type: tab
          fields:
            header.media_order:
              type: hidden


        liste:
          type: tab
          title: Mitglieder
          fields:
            header.intro:
              type: textarea
              label: Einleitungstext
              rows: 3
            header.mitglieder:
              type: list
              label: OK-Mitglieder
              style: vertical
              help: Reihenfolge durch Verschieben ändern — Präsident zuoberst.
              fields:
                .name:
                  type: text
                  label: Name
                .funktion:
                  type: text
                  label: Funktion
                  placeholder: Präsident
                .portrait:
                  type: pagemediaselect
                  label: Portrait
                  accept:
                    - image/*
                .email:
                  type: email
                  label: E-Mail
                .telefon:
                  type: tel
                  label: Telefon

        kopfbild:
          type: tab
          title: Teilen
          fields:
            header.kopfhintergrund:
              type: pagemediaselect
              label: Vorschaubild beim Teilen
              help: Wird auf der Seite selbst nicht gezeigt. Erscheint nur, wenn jemand den Link auf Facebook, WhatsApp oder Instagram teilt.
              accept:
                - image/*

        portraits:
          type: tab
          title: Portraits
          fields:
            header.media_order:
              type: pagemedia
              label: Portraits