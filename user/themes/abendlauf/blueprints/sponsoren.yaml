title: Sponsoren
extends@:
  type: default
  context: blueprints://pages

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:

        # Gravs Reiter „Inhalt“ zeigt dieselben Dateien wie unser
        # Reiter „Logos“. Einmal reicht - sonst weiss niemand,
        # welcher der richtige ist.
        content:
          type: tab
          fields:
            header.media_order:
              type: hidden


        liste:
          type: tab
          title: Sponsoren
          fields:
            header.intro:
              type: textarea
              label: Einleitungstext
              rows: 3
            header.sponsoren:
              type: list
              label: Sponsoren
              style: vertical
              help: Logos zuerst unter „Logos" hochladen, danach hier zuordnen. Reihenfolge durch Verschieben ändern.
              fields:
                .name:
                  type: text
                  label: Name
                .logo:
                  type: pagemediaselect
                  label: Logo
                  accept:
                    - image/*
                .url:
                  type: text
                  label: Website
                .kategorie:
                  type: select
                  label: Kategorie
                  default: sponsor
                  options:
                    haupt: Hauptsponsor
                    co: Co-Sponsor
                    sponsor: Sponsor
                    goenner: Gönner
                .aktiv:
                  type: toggle
                  label: Aktiv
                  highlight: 1
                  default: true
                  options:
                    1: Wird gezeigt
                    0: Pausiert
                  validate:
                    type: bool
                .danke:
                  type: toggle
                  label: Im Danketext nennen
                  help: 'Erscheint in den Aktuell-Texten der Startseite dort, wo {sponsoren} steht.'
                  highlight: 1
                  default: false
                  options:
                    1: Ja
                    0: Nein
                  validate:
                    type: bool

        kopfbild:
          type: tab
          title: Teilen
          fields:
            header.kopfhintergrund:
              type: pagemediaselect
              label: Vorschaubild beim Teilen
              help: Wird auf der Seite selbst nicht gezeigt. Erscheint nur, wenn jemand den Link auf Facebook, WhatsApp oder Instagram teilt.
              accept:
                - image/*

        logos:
          type: tab
          title: Logos
          fields:
            header.media_order:
              type: pagemedia
              label: Logos
