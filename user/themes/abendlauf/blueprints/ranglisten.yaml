title: Ranglisten
extends@:
  type: default
  context: blueprints://pages

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:

        # Gravs Reiter „Inhalt“ zeigt dieselben Dateien wie unser
        # Reiter „Ranglisten“. Einmal reicht - sonst weiss niemand,
        # welcher der richtige ist.
        content:
          type: tab
          fields:
            header.media_order:
              type: hidden

        angaben:
          type: tab
          title: Angaben
          fields:
            header.intro:
              type: textarea
              label: Einleitungstext
              rows: 3
            header.kopfhintergrund:
              type: pagemediaselect
              label: Vorschaubild beim Teilen
              help: Wird auf der Seite selbst nicht gezeigt. Erscheint nur, wenn jemand den Link auf Facebook, WhatsApp oder Instagram teilt.
              accept:
                - image/*

        treue:
          type: tab
          title: Jahr für Jahr dabei
          fields:
            header.treueaktiv:
              type: toggle
              label: Bereich anzeigen
              highlight: 1
              default: true
              options:
                1: Wird angezeigt
                0: Ausgeblendet
              validate:
                type: bool
            header.treuetitel:
              type: text
              label: Überschrift
            header.treuehinweis:
              type: text
              label: Hinweis zur Datenbasis
            header.treue:
              type: list
              label: Teilnehmende
              style: vertical
              fields:
                .name:
                  type: text
                  label: Name
                .jahrgang:
                  type: number
                  label: Jahrgang
                .jahre:
                  type: number
                  label: Jahre dabei
                .von:
                  type: number
                  label: von wie vielen ausgewerteten Jahren

        dateien:
          type: tab
          title: Ranglisten
          fields:
            hinweis:
              type: display
              size: large
              markdown: true
              content: |
                **PDF hineinziehen – fertig.**

                Die Seite ordnet eine neue Rangliste selbst Jahr und Lauf zu:

                - **Am Laufabend hochgeladen** (bis eine Woche danach) gilt sie
                  als Rangliste dieses Abends. Die Daten kommen aus dem Reiter
                  *Laufabende* der Startseite.
                - Am letzten Abend ist die **erste** PDF der 3. Abend, die
                  **zweite** die Gesamtrangliste. Steht „gesamt" im Dateinamen,
                  ist es immer die Gesamtrangliste.
                - Nennt der **Dateiname** Jahr und Lauf – etwa
                  `2027-2-abend.pdf` oder `Rangliste Lauf 2 2027.pdf` –, gilt
                  der Name, egal wann hochgeladen wird.

                Während der Laufabende meldet ein Hinweis zuoberst auf der
                Website drei Tage lang „Neu online: 2. Abend 2027".

                **Prüfen oder korrigieren:** Stift-Symbol an der Datei. Dort
                stehen Titel, Art, Jahr und Lauf (`1`, `2`, `3` oder `gesamt`).
                Was dort steht, wird nie überschrieben.

            header.media_order:
              type: pagemedia
              label: Dateien