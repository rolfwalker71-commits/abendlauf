title: Ranglisten
extends@:
  type: default
  context: blueprints://pages

form:
  fields:
    tabs:
      type: tabs
      active: 1
      fields:
        angaben:
          type: tab
          title: Angaben
          fields:
            header.intro:
              type: textarea
              label: Einleitungstext
              rows: 3
            header.kopfhintergrund:
              type: pagemedia
              label: Hintergrundbild des Kopfbereichs

        treue:
          type: tab
          title: Jahr für Jahr dabei
          fields:
            header.treueaktiv:
              type: toggle
              label: Bereich anzeigen
              highlight: 1
              default: true
              options:
                1: Wird angezeigt
                0: Ausgeblendet
              validate:
                type: bool
            header.treuetitel:
              type: text
              label: Überschrift
            header.treuehinweis:
              type: text
              label: Hinweis zur Datenbasis
            header.treue:
              type: list
              label: Teilnehmende
              style: vertical
              fields:
                .name:
                  type: text
                  label: Name
                .jahrgang:
                  type: number
                  label: Jahrgang
                .jahre:
                  type: number
                  label: Jahre dabei
                .von:
                  type: number
                  label: von wie vielen ausgewerteten Jahren

        dateien:
          type: tab
          title: Ranglisten
          fields:
            hinweis:
              type: display
              size: large
              markdown: true
              content: |
                **Anders als bei den Fotos gibt es hier keine Unterseiten —
                alle PDFs hängen an dieser einen Seite.**

                So kommt eine neue Rangliste dazu:

                1. Unten im Feld **Dateien** die PDF hineinziehen
                2. Auf das **Stift-Symbol** an der Datei klicken
                3. Ausfüllen:
                   **Titel** — was auf der Website steht, etwa „Gesamtrangliste"
                   **Art** — `rangliste` (oder `ausschreibung`, `strecke`, `sonstiges`)
                   **Jahr** — etwa `2027`
                   **Lauf** — `1`, `2`, `3` oder `gesamt`
                4. Speichern

                Die Tabelle ordnet sich danach von selbst: eine Zeile pro
                Jahrgang, eine Spalte pro Abend. Auch die Zahlen im Kopfbereich
                — Jahrgänge, Anzahl Ranglisten, ältester und neuester Jahrgang —
                zählen sich neu.

                Ein Dateiname wie `2027-gesamt.pdf` hilft der Übersicht, ist
                aber nicht nötig: Massgebend sind allein die Angaben oben.
            media:
              type: file
              destination: self@
              multiple: true
              label: Dateien
              accept:
                - application/pdf
                - image/*
