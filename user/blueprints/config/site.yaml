title: Site
extends@:
  type: site
  context: blueprints://config

form:
  fields:
    verein:
      type: fieldset
      title: Urner Abendläufe
      icon: heart
      collapsed: false
      fields:
        verein.titel:
          label: Name der Website
          type: text
        verein.untertitel:
          label: Untertitel
          type: text
          help: Erscheint klein neben dem Logo.
        verein.gruendung:
          label: Jahr der ersten Austragung
          type: number
          help: Daraus werden die Austragungsnummer und die „seit"-Angaben berechnet.
          validate:
            min: 1900
            max: 2100
        verein.ausgefallen:
          label: Ausgefallene Jahre
          type: list
          style: vertical
          help: Zählen bei der Austragungsnummer nicht mit. 1994 war die erste Austragung, 2026 wegen 2020 erst die 32.
          fields:
            .jahr:
              type: number
              label: Jahr
              validate:
                min: 1994
                max: 2100
            .grund:
              type: text
              label: Grund
              placeholder: Corona
        verein.hauptaktion:
          label: Hervorgehobener Menüpunkt
          type: text
          help: 'Adresse der wichtigsten Seite, z. B. /ausschreibung. Erscheint rechts im Menü als Knopf und nicht mehr in der Liste. Leer lassen für kein Hervorheben.'
        verein.adresse:
          label: Adresse
          type: textarea
          rows: 3
        verein.email:
          label: E-Mail-Adresse
          type: email
        verein.formular_empfaenger:
          label: Kontaktformular geht an
          type: email
          help: An diese Adresse werden Nachrichten aus dem Formular gesendet.
        verein.facebook:
          label: Facebook
          type: url
        verein.instagram:
          label: Instagram
          type: url
        verein.fusszeile:
          label: Fusszeile
          type: text
          help: Das Jahr und das ©-Zeichen stehen automatisch davor.
